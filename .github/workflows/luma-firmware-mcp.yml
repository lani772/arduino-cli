name: LUMA Firmware MCP

on:
  push:
    paths:
      - "luma-firmware-mcp/**"
      - ".github/workflows/luma-firmware-mcp.yml"
  pull_request:
    paths:
      - "luma-firmware-mcp/**"
      - ".github/workflows/luma-firmware-mcp.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: luma-firmware-mcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Format, test, race, vet, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
          cache-dependency-path: luma-firmware-mcp/go.mod
      - name: Check Go formatting for changed files
        working-directory: luma-firmware-mcp
        shell: bash
        run: |
          # Existing module files need a separate formatting-only pass.
          changed_go="$(git diff-tree --no-commit-id --name-only -r HEAD -- 'luma-firmware-mcp/*.go' 'luma-firmware-mcp/**/*.go')"
          if [[ -z "$changed_go" ]]; then
            echo "No Go files changed in this commit; formatting check is not applicable."
            exit 0
          fi
          unformatted="$(printf '%s\\n' "$changed_go" | xargs -r gofmt -l)"
          if [[ -n "$unformatted" ]]; then
            echo "These changed Go files are not gofmt-formatted:"
            printf '%s\\n' "$unformatted"
            exit 1
          fi
      - name: Check whitespace errors
        run: git diff --check
      - name: Run module tests
        working-directory: luma-firmware-mcp
        run: go test ./...
      - name: Run race-enabled module tests
        working-directory: luma-firmware-mcp
        run: go test -race ./...
      - name: Run go vet
        working-directory: luma-firmware-mcp
        run: go vet ./...
      - name: Compile all packages
        working-directory: luma-firmware-mcp
        run: go build ./...
