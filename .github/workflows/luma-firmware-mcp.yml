name: LUMA Firmware MCP

on:
  push:
    paths:
      - "luma-firmware-mcp/**"
      - ".github/workflows/luma-firmware-mcp.yml"
  pull_request:
    paths:
      - "luma-firmware-mcp/**"
      - ".github/workflows/luma-firmware-mcp.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: luma-firmware-mcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Format, test, race, vet, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
          cache-dependency-path: luma-firmware-mcp/go.mod
      - name: Format Go sources
        working-directory: luma-firmware-mcp
        run: find . -type f -name '*.go' -print0 | xargs -0 -r gofmt -w
      - name: Run module tests
        working-directory: luma-firmware-mcp
        run: go test ./...
      - name: Run race-enabled module tests
        working-directory: luma-firmware-mcp
        run: go test -race ./...
      - name: Run go vet
        working-directory: luma-firmware-mcp
        run: go vet ./...
      - name: Compile all packages
        working-directory: luma-firmware-mcp
        run: go build ./...
